name: Publish Panda Remit Tutorial Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download site package
        run: |
          curl -L "https://3041f82f984223.lhr.life/site.zip" -o site.zip
          mkdir site
          unzip site.zip -d site
          rm -f site/site.zip
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
